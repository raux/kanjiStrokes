<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日の一字 — 木</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f1e7;
      --paper-shadow: #e5ddcf;
      --ink: #302d29;
      --guide: #d5ccbe;
      --accent: #a84e39;
      --muted: #766f66;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 35%, #fffdf8 0, var(--paper) 54%, #e9e0d2 100%);
      color: var(--ink);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif JP", ui-serif, Georgia, serif;
    }
    main { width: min(92vw, 580px); text-align: center; padding: 3rem 1.5rem; }
    .eyebrow { color: var(--accent); font: 600 .72rem/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: .5rem 0 .2rem; font-size: clamp(2.2rem, 6vw, 3.8rem); font-weight: 500; }
    .reading { margin: 0; color: var(--muted); font-size: 1rem; }
    .sheet { margin: 2.2rem auto 1.5rem; padding: 1.3rem; max-width: 410px; background: rgba(255,253,248,.62); border: 1px solid var(--paper-shadow); box-shadow: 0 18px 45px rgba(66, 51, 33, .08); }
    svg { width: 100%; display: block; }
    .stroke {
      fill: none;
      stroke: var(--guide);
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#soft-ink);
    }
    .stroke.active { stroke: var(--accent); }
    .stroke.complete { stroke: var(--ink); }
    #brush { fill: var(--accent); filter: drop-shadow(0 1px 2px rgba(0,0,0,.18)); }
    .paper-fibre { opacity: .38; mix-blend-mode: multiply; }
    .status { min-height: 1.5em; color: var(--muted); font-size: .95rem; }
    button { margin-top: 1rem; padding: .7rem 1.05rem; border: 1px solid #b9aa96; border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; font: 600 .85rem ui-sans-serif, system-ui, sans-serif; letter-spacing: .03em; }
    button:hover, button:focus-visible { background: #fffaf1; outline: 3px solid rgba(168,78,57,.2); outline-offset: 3px; }
    .hint { margin-top: 2rem; color: var(--muted); font-size: .9rem; }
    @media (prefers-reduced-motion: reduce) { #brush { display: none; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">今日の一字 · today’s character</div>
    <h1>木</h1>
    <p class="reading">き / もく &nbsp;—&nbsp; tree</p>

    <section class="sheet" aria-label="Animated stroke order for 木">
      <svg viewBox="0 0 200 200" role="img" aria-label="The four strokes of the kanji 木">
        <defs>
          <filter id="soft-ink" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="1" seed="7" result="grain" />
            <feDisplacementMap in="SourceGraphic" in2="grain" scale=".45" xChannelSelector="R" yChannelSelector="G" />
          </filter>
          <filter id="paper-grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" /></filter>
        </defs>
        <rect class="paper-fibre" x="8" y="8" width="184" height="184" filter="url(#paper-grain)" />
        <path class="stroke" stroke-width="7" d="M45 57 C71 52 117 55 155 50" />
        <path class="stroke" stroke-width="10" d="M103 33 C100 67 103 119 99 168" />
        <path class="stroke" stroke-width="8" d="M94 101 C82 120 62 143 46 159" />
        <path class="stroke" stroke-width="9" d="M109 100 C123 119 146 145 159 160" />
        <circle id="brush" r="5" opacity="0" />
      </svg>
    </section>

    <p id="status" class="status" aria-live="polite">Breathe. Follow the brush.</p>
    <button id="replay" type="button">Replay slowly</button>
    <p class="hint">Four strokes · pause after each gesture</p>
  </main>

  <script>
    const strokes = [...document.querySelectorAll('.stroke')];
    const brush = document.querySelector('#brush');
    const status = document.querySelector('#status');
    const replay = document.querySelector('#replay');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const pause = ms => new Promise(resolve => setTimeout(resolve, ms));

    function reset() {
      strokes.forEach(stroke => {
        stroke.classList.remove('active', 'complete');
        const length = stroke.getTotalLength();
        stroke.style.strokeDasharray = length;
        stroke.style.strokeDashoffset = length;
      });
      brush.setAttribute('opacity', '0');
    }

    function draw(stroke, duration) {
      const length = stroke.getTotalLength();
      stroke.classList.add('active');
      return new Promise(resolve => {
        const start = performance.now();
        function frame(now) {
          const raw = Math.min((now - start) / duration, 1);
          const progress = 1 - Math.pow(1 - raw, 3); // gentle ease-out
          stroke.style.strokeDashoffset = length * (1 - progress);
          const point = stroke.getPointAtLength(length * progress);
          brush.setAttribute('cx', point.x);
          brush.setAttribute('cy', point.y);
          brush.setAttribute('opacity', raw < 1 ? '1' : '0');
          if (raw < 1) requestAnimationFrame(frame);
          else {
            stroke.classList.remove('active');
            stroke.classList.add('complete');
            resolve();
          }
        }
        requestAnimationFrame(frame);
      });
    }

    async function play() {
      replay.disabled = true;
      reset();
      if (reducedMotion.matches) {
        strokes.forEach(stroke => stroke.classList.add('complete'));
        strokes.forEach(stroke => stroke.style.strokeDashoffset = '0');
        status.textContent = '木 — four quiet strokes.';
      } else {
        for (let i = 0; i < strokes.length; i++) {
          status.textContent = `Stroke ${i + 1} of ${strokes.length}`;
          await draw(strokes[i], 850);
          await pause(600);
        }
        status.textContent = 'Rest with the completed character.';
      }
      replay.disabled = false;
    }

    replay.addEventListener('click', play);
    play();
  </script>
</body>
</html>
